<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Import Engine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .upload-area {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9ff;
      margin-bottom: 20px;
    }
    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f1ff;
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    .upload-text {
      color: #333;
      font-weight: 500;
      margin-bottom: 5px;
    }
    .upload-hint {
      color: #999;
      font-size: 12px;
    }
    input[type="file"] {
      display: none;
    }
    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      transition: transform 0.2s;
    }
    .button:hover {
      transform: translateY(-2px);
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .questions-section {
      margin-top: 40px;
      border-top: 1px solid #eee;
      padding-top: 30px;
    }
    .questions-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }
    .question-item {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .question-item-text {
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    .question-item-domain {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 8px;
    }
    .question-item-difficulty {
      display: inline-block;
      background: #764ba2;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .stat-box {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 Document Import Engine</h1>
    <p class="subtitle">Upload questions from multiple file formats</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📁</div>
      <div class="upload-text">Click to upload or drag and drop</div>
      <div class="upload-hint">Supported: JSON, CSV, XLSX, PDF, DOCX, XML, TXT, TSV</div>
      <input type="file" id="fileInput" onchange="handleFileUpload(event)">
    </div>

    <button type="button" class="button" onclick="document.getElementById('fileInput').click()">
      Choose File
    </button>

    <div class="status" id="status"></div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-value" id="totalQuestions">0</div>
        <div class="stat-label">Total Questions</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="lastImport">-</div>
        <div class="stat-label">Status</div>
      </div>
    </div>

    <div class="questions-section">
      <h2>📋 Recent Questions</h2>
      <div id="questionsList"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', loadQuestions);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status show loading';
      statusDiv.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/api/documents/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = 'status show success';
          statusDiv.textContent = 'Success! Saved: ' + data.savedRecords + ' | Duplicates: ' + data.duplicateRecords;
          setTimeout(() => {
            loadQuestions();
            event.target.value = '';
          }, 1500);
        } else {
          statusDiv.className = 'status show error';
          statusDiv.textContent = 'Error: ' + (data.error || 'Upload failed');
        }
      } catch (error) {
        statusDiv.className = 'status show error';
        statusDiv.textContent = 'Error: ' + error.message;
      }
    }

    async function loadQuestions() {
      try {
        const response = await fetch('/api/questions');
        const data = await response.json();

        document.getElementById('totalQuestions').textContent = data.total || 0;

        const questionsList = document.getElementById('questionsList');
        if (data.data && data.data.length > 0) {
          questionsList.innerHTML = data.data.slice(0, 3).map(q => {
            return '<div class="question-item"><div class="question-item-text">' +
                   escapeHtml(q.question) +
                   '</div><span class="question-item-domain">' +
                   escapeHtml(q.domain || 'N/A') +
                   '</span><span class="question-item-difficulty">' +
                   escapeHtml(q.difficulty || 'N/A') +
                   '</span></div>';
          }).join('');
        } else {
          questionsList.textContent = 'No questions yet. Upload a file!';
          questionsList.style.color = '#999';
          questionsList.style.textAlign = 'center';
          questionsList.style.padding = '20px';
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    const uploadArea = document.querySelector('.upload-area');
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#764ba2';
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#667eea';
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#667eea';
      if (e.dataTransfer.files[0]) {
        document.getElementById('fileInput').files = e.dataTransfer.files;
        handleFileUpload({ target: { files: e.dataTransfer.files } });
      }
    });
  </script>
</body>
</html>
